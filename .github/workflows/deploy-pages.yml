name: Deploy MOYSTER Compose PWA

on:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Compose/Wasm production website
        run: gradle :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Verify generated site
        run: |
          test -s composeApp/build/dist/wasmJs/productionExecutable/index.html
          test -s composeApp/build/dist/wasmJs/productionExecutable/manifest.webmanifest
          test -s composeApp/build/dist/wasmJs/productionExecutable/sw.js
          touch composeApp/build/dist/wasmJs/productionExecutable/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
