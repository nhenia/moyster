name: Verify Compose PWA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/compose-multiplatform-pwa]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Compose WebAssembly
        run: gradle :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Validate PWA artifact
        run: |
          test -s composeApp/build/dist/wasmJs/productionExecutable/index.html
          test -s composeApp/build/dist/wasmJs/productionExecutable/manifest.webmanifest
          test -s composeApp/build/dist/wasmJs/productionExecutable/sw.js
